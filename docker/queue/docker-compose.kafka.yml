services:
  kafka:
    image: apache/kafka:latest
    ports:
      - "9094:9094"
    command:
      - sh
      - -ec
      - |
          cat > /tmp/kraft-server.properties <<'EOF'
          process.roles=broker,controller
          node.id=1
          controller.quorum.voters=1@kafka:9093

          listeners=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
          advertised.listeners=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
          listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
          controller.listener.names=CONTROLLER
          inter.broker.listener.name=PLAINTEXT

          log.dirs=/tmp/kraft-logs
          num.partitions=16
          auto.create.topics.enable=true
          EOF

          rm -rf /tmp/kraft-logs
          mkdir -p /tmp/kraft-logs

          CLUSTER_ID="$(/opt/kafka/bin/kafka-storage.sh random-uuid)"
          /opt/kafka/bin/kafka-storage.sh format -t "$$CLUSTER_ID" -c /tmp/kraft-server.properties --ignore-formatted

          exec /opt/kafka/bin/kafka-server-start.sh /tmp/kraft-server.properties

  kafka-init:
    image: apache/kafka:latest
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-ec"]
    command: |
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
        --create --if-not-exists --topic kagzi-work --partitions 16 --replication-factor 1
    restart: "no"
